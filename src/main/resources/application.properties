springdoc.api-docs.path=/api-docs
server.servlet.contextPath=/api
server.port=8080

# Logs JSON structurés pour l'observabilité locale et la collecte CI/production.
# La valeur peut être remplacée par LOG_FORMAT=console pour un affichage lisible.
logging.structured.format.console=${LOG_FORMAT:logstash}
logging.structured.ecs.service.name=datashare-backend
logging.structured.ecs.service.version=${APP_VERSION:0.0.1-SNAPSHOT}

# Spring Boot demarre PostgreSQL via Docker Compose avant Flyway et JPA.
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}
spring.docker.compose.file=${DOCKER_COMPOSE_FILE:compose.yaml}
spring.docker.compose.lifecycle-management=start-only
spring.docker.compose.readiness.timeout=2m

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:datashare}}
spring.datasource.username=${POSTGRES_USER:datashare}
spring.datasource.password=${POSTGRES_PASSWORD:datashare}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=1000000000B
spring.servlet.multipart.max-request-size=1001000000B
spring.servlet.multipart.file-size-threshold=0B
server.tomcat.max-swallow-size=-1

# Cle Base64 facultative : sinon JwtService utilise la cle locale propre a DataShare.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:http://localhost:8080/api}
app.jwt.ttl=PT24H
app.storage.directory=${UPLOAD_DIRECTORY:./uploads}
app.storage.max-bytes=1000000000
app.storage.blocked-extensions=exe,bat,cmd,com,msi,sh,ps1,jar
app.public-api-url=${PUBLIC_API_URL:http://localhost:8080/api}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
